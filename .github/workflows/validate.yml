name: validate posts

on:
  pull_request:
    paths: ["posts/**"]
  push:
    branches: [main]
    paths: ["posts/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.mjs
